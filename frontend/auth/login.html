<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEMERTAZ – Inicio de Sesión</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: backgroundShift 20s ease-in-out infinite;
    }

    @keyframes backgroundShift {

      0%,
      100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

    .login-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      padding: 40px;
      animation: slideInUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .logo-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-circle {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 36px;
      font-weight: bold;
      margin: 0 auto 20px;
      animation: logoPulse 2s ease-in-out infinite;
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
    }

    @keyframes logoPulse {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
      }

      50% {
        transform: scale(1.05);
        box-shadow: 0 12px 32px rgba(102, 126, 234, 0.4);
      }
    }

    .logo-section h1 {
      color: #111827;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .logo-section p {
      color: #6b7280;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #111827;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: inherit;
      background: #f9fafb;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      background: white;
      transform: translateY(-1px);
    }

    input:hover {
      border-color: #d1d5db;
    }

    .login-btn {
      width: 100%;
      padding: 12px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 20px;
      position: relative;
      overflow: hidden;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.6s;
    }

    .login-btn:hover::before {
      left: 100%;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error-message {
      background-color: #fee2e2;
      color: #dc2626;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
      border-left: 4px solid #dc2626;
    }

    .error-message.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
    }

    .spinner {
      border: 3px solid #f3f4f6;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .demo-credentials {
      background-color: #f0f9ff;
      border-left: 4px solid #0ea5e9;
      padding: 12px;
      border-radius: 4px;
      margin-top: 20px;
      font-size: 12px;
      color: #0c4a6e;
    }

    .demo-credentials p {
      margin: 4px 0;
    }

    .demo-credentials strong {
      color: #0c4a6e;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="logo-section">
      <div class="logo-circle">S</div>
      <h1>SEMERTAZ</h1>
      <p>Sistema de Monitoreo y Control</p>
    </div>

    <form id="loginForm">
      <div class="error-message" id="errorMessage"></div>

      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" required placeholder="Ingresa tu usuario" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña" />
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Iniciando sesión...</p>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        Iniciar Sesión
      </button>
    </form>

    <div class="demo-credentials">
      <p><strong>Credenciales de prueba:</strong></p>
      <p>Usuario: <code>admin</code></p>
      <p>Contraseña: <code>123456</code></p>
      <p style="margin-top: 8px;"><strong>Otros usuarios:</strong></p>
      <p>supervisor1 / 123456</p>
      <p>controller1 / 123456</p>
    </div>
  </div>

  <script>
    const API_URL = `${window.location.protocol}//${window.location.hostname}:5000/api`;


    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');
      const loading = document.getElementById('loading');
      const loginBtn = document.getElementById('loginBtn');

      // Limpiar error anterior
      errorMessage.classList.remove('show');
      errorMessage.textContent = '';

      // Mostrar loading
      loading.style.display = 'block';
      loginBtn.disabled = true;

      try {
        const response = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Error al iniciar sesión');
        }

        // Guardar token y usuario en localStorage
        localStorage.setItem('token', data.access_token);
        localStorage.setItem('user', JSON.stringify(data.user));

        // Redirigir al dashboard
        window.location.href = '/';
      } catch (error) {
        errorMessage.textContent = error.message;
        errorMessage.classList.add('show');
      } finally {
        loading.style.display = 'none';
        loginBtn.disabled = false;
      }
    });

    // Si ya hay token, redirigir al dashboard
    if (localStorage.getItem('token')) {
      window.location.href = '/';
    }
  </script>
</body>

</html>
